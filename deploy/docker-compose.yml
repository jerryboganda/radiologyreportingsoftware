# Production stack on the VPS (/opt/docker/polytronx-radiology). No published ports: Nginx Proxy Manager reaches the
# container by name over the shared `platform` network, so nothing is reachable except through the proxy (and its password gate).
#   docker compose pull && docker compose up -d
#
# worker: the AI engine container. Claims queued cases over the internal network and runs both engines server-side,
# so it keeps working when the owner's PC is off:
#   - antigravity: the agy CLI baked into the image; its Google sign-in (AI Pro subscription quota, never API billing)
#     lives in ./agy-home + ./agy-keyrings, unlocked at start with KEYRING_PASSWORD from the .env.
#   - opencode: direct HTTPS to the OpenCode Go gateway with OPENCODE_API_KEY from the .env.
# Seeding (one-time): copy the signed-in agy state into ./agy-home and ./agy-keyrings and chown 1000:1000 (see deploy/README.md).
services:
  app:
    image: ghcr.io/jerryboganda/radiologyreportingsoftware:${IMAGE_TAG:-latest}
    container_name: polytronx-radiology-app
    restart: unless-stopped
    env_file: .env # BASIC_AUTH_USER, BASIC_AUTH_PASS (chmod 600)
    environment:
      TZ: Asia/Karachi
    volumes:
      - ./data:/app/data # SQLite database
      - ./uploads:/app/uploads # patient note photos
    networks: [platform]
    mem_limit: 1536m
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  worker:
    image: ghcr.io/jerryboganda/radiologyreportingsoftware:${IMAGE_TAG:-latest}
    container_name: polytronx-radiology-worker
    restart: unless-stopped
    depends_on: [app]
    entrypoint: ["/usr/local/bin/worker-entrypoint.sh"] # dbus + keyring unlock, then the queue worker
    env_file: .env # BASIC_AUTH_USER, BASIC_AUTH_PASS, OPENCODE_API_KEY, KEYRING_PASSWORD (chmod 600)
    environment:
      TZ: Asia/Karachi
      APP_URL: http://polytronx-radiology-app:4321 # internal, through the password gate
      APP_BASIC_AUTH: ${BASIC_AUTH_USER}:${BASIC_AUTH_PASS}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      KEYRING_PASSWORD: ${KEYRING_PASSWORD:-}
      AGY_BIN: /usr/local/bin/agy
    volumes:
      - ./agy-home:/home/node/.gemini # agy sign-in state and CLI settings
      - ./agy-keyrings:/home/node/.local/share/keyrings # Secret Service store for the Google tokens
    networks: [platform]
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

networks:
  platform:
    external: true
