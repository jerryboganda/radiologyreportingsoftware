name: Build image

# Builds the production image on GitHub's runners and pushes it to GHCR; the VPS only pulls it.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - 'start-app.cmd'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jerryboganda/radiologyreportingsoftware:latest
            ghcr.io/jerryboganda/radiologyreportingsoftware:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
